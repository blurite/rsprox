  macos:
    name: macOS ${{ matrix.arch }}
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
            script: build-osx-aarch64.sh
            dmg: RSProx-aarch64.dmg
          - arch: x64
            runner: macos-15-intel
            script: build-osx-x64.sh
            dmg: RSProx-x64.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mac-jar

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Clone native dependencies
        run: |
          git clone https://github.com/jamesderlin/dropt installer/native/dropt
          git -C installer/native/dropt checkout --detach 4fc907206a5327a73e456250780582692b9ffd2f
          git clone https://github.com/chadaustin/sajson installer/native/sajson
          git -C installer/native/sajson checkout --detach 309eaa812460d8a9b309f25503a21e19c0e386f0

      - name: Build unsigned DMG
        run: ./installer/scripts/${{ matrix.script }} --build --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: ${{ matrix.dmg }}
          if-no-files-found: error

      - name: Upload for release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.dmg }}
